# Site settings — replace the placeholders below
title: Your Name
author: Your Name
description: >-
  Role / headline (e.g. "Software Engineer & Data Scientist").
  One or two sentences about what you build and what you care about.
url: "https://mlp-20.github.io"
baseurl: ""
lang: en-US

# Theme (GitHub Pages "Minimal")
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Sidebar
logo: /assets/img/profile.jpg
show_downloads: false

# Social links (used by the sidebar in _layouts/default.html)
social:
  github: mlp-20
  linkedin: YOUR_LINKEDIN_HANDLE
  email: you@example.com

# Navigation
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects.html
  - title: Blog
    url: /blog.html
  - title: Books
    url: /books.html
  - title: About
    url: /about.html
  - title: Contact
    url: /contact.html

# Google Analytics (optional)
# google_analytics: G-XXXXXXXXXX

permalink: /blog/:year/:month/:day/:title.html

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
