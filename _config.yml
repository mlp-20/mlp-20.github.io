# Site settings — replace the placeholders below
title: Manuel Leite Pinho
author: Manuel Leite Pinho
description: >-
  Process Engineer in Frankfurt. Chemical engineer working across
  process simulation, digital tools and research.
url: "https://mlp-20.github.io"
baseurl: ""
lang: en-US

# Theme (GitHub Pages "Minimal")
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Sidebar
# Uncomment once assets/img/profile.jpg is added
# logo: /assets/img/profile.jpg
show_downloads: false

# Social links (used by the sidebar in _layouts/default.html)
social:
  github: mlp-20
  linkedin: manuel-leite-pinho
  email: leite.pinho.manuel@gmail.com

# Navigation
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects.html
  - title: About
    url: /about.html
  - title: Contact
    url: /contact.html

# Google Analytics (optional)
# google_analytics: G-XXXXXXXXXX

permalink: /blog/:year/:month/:day/:title.html

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
