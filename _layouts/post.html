---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
  {{ content }}
  <p><a href="{{ "/blog.html" | relative_url }}">&larr; Back to blog</a></p>
</article>
